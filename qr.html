<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Menu QR - TAC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Rye&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f2ebe0;
            --text-main: #2d241c;
            --border-primary: #db8d46;
            --qr-border: #b2a89a;
            --pill-border: #d1b99a;
        }
        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .qr-card {
            background-color: var(--bg-color);
            border: 10px solid var(--border-primary);
            border-radius: 150px;
            text-align: center;
            width: 1900px;
            max-width: none;
            padding: 200px 150px;
            box-sizing: border-box;
            position: relative;
        }
        
        .steam-icon {
            margin-bottom: 50px;
        }
        .steam-icon svg {
            width: 120px;
            height: 120px;
            stroke: #d0c0a9;
            stroke-width: 4px;
            fill: none;
            stroke-linecap: round;
        }

        .header-title {
            font-family: 'Rye', serif;
            font-size: 240px;
            color: var(--text-main);
            margin: 0;
            line-height: 1;
            letter-spacing: 15px;
            text-transform: uppercase;
        }

        .header-subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 160px;
            color: var(--text-main);
            margin: 0;
            line-height: 0.8;
            margin-top: 50px;
            font-weight: 600;
        }

        .description {
            font-family: 'Inter', sans-serif;
            font-size: 70px;
            font-weight: 500;
            color: #3b3026;
            margin-top: 120px;
            margin-bottom: 150px;
            max-width: 1300px;
            margin-inline: auto;
            line-height: 1.4;
        }

        .qr-container {
            border: 10px dashed var(--qr-border);
            border-radius: 100px;
            padding: 60px;
            display: inline-block;
            background-color: transparent;
        }

        .qr-container img {
            width: 750px;
            height: 750px;
            display: block;
            border-radius: 50px;
        }

        .contact-pill {
            margin-top: 200px;
            border: 8px dashed var(--pill-border);
            border-radius: 200px;
            padding: 50px 120px;
            display: inline-flex;
            align-items: center;
            gap: 60px;
        }

        .contact-pill svg {
            width: 80px;
            height: 80px;
            stroke: var(--border-primary);
            stroke-width: 3px;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .contact-pill span {
            font-family: 'Inter', sans-serif;
            font-size: 75px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 2.5px;
        }
    </style>
</head>
<body>
    <div class="qr-card">
        <div class="steam-icon">
            <svg viewBox="0 0 24 24">
                <path d="M8 2c0 3-3 5-3 8s3 5 3 8 M12 2c0 3-3 5-3 8s3 5 3 8 M16 2c0 3-3 5-3 8s3 5 3 8" />
            </svg>
        </div>
        
        <h1 class="header-title">TAC</h1>
        <h2 class="header-subtitle">The Artist's Cafe</h2>
        
        <p class="description">Scan to explore our menu of delicious food and refreshing drinks.</p>
        
        <div class="qr-container">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=https://tac-menu.pages.dev&color=3e3023&bgcolor=f2ebe0&margin=0" alt="Menu QR Code">
        </div>
        
        <div class="contact-pill">
            <svg viewBox="0 0 24 24">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            <span>+91 99472 61135</span>
        </div>
    </div>
</body>
</html>
