<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Panel - Trattorias</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="css/admin.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script>
        (async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = '../login/';
            }
            
            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_OUT' || !session) {
                    window.location.href = '../login/';
                }
            });
        })();
    </script>
    <!-- Load styles from main site for preview accuracy -->
    
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Trattorias<br>Restaurant</span>
            <button class="mobile-close-btn" id="mobileCloseBtn"><i data-lucide="x"></i></button>
        </div>
        <ul class="nav-links" style="flex: 1;">
            <li><a class="nav-link active" data-view="banners">Banners</a></li>
            <li><a class="nav-link" data-view="recommended">Recommended</a></li>
            <li><a class="nav-link" data-view="products">Products</a></li>
            <li><a class="nav-link" data-view="categories">Categories</a></li>
            <li style="margin-top: auto; margin-bottom: 24px;"><button class="btn logout-solid-btn" id="logoutBtn"><i data-lucide="log-out"></i> Logout</button></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <div class="header-title-group">
                <button class="mobile-nav-toggle" id="mobileNavBtn"><i data-lucide="menu"></i></button>
                <h1 id="pageTitle">Dashboard</h1>
            </div>
            
            <div class="header-controls">
                <div class="search-wrapper">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search..." onkeyup="filterTable()">
                </div>
                <div id="headerActions"></div>
            </div>
        </div>

        <div id="viewContainer">
            <!-- Views will be rendered here by admin.js -->
        </div>
    </main>

    <!-- Dynamic Modal -->
    <div class="modal-overlay" id="formModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Item</h2>
                <button class="btn btn-secondary" onclick="closeModal()" style="border:none; padding:4px;"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-section" id="modalFormContent">
                    <!-- Form fields generated dynamically -->
                </div>
                <div class="preview-section" id="modalPreviewContent">
                    <!-- Live preview generated dynamically -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" id="saveBtn">Save Changes</button>
            </div>
        </div>
    </div>
    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Confirmation Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Confirm Action</h2>
                <button class="btn btn-secondary" onclick="closeConfirmModal()" style="border:none; padding:4px;"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body" style="padding: 24px; text-align: center; flex-direction: column; gap: 24px;">
                <p id="confirmMessage" style="font-size: 16px; margin: 0;">Are you sure?</p>
                <div style="display: flex; justify-content: center; gap: 12px;">
                    <button class="btn btn-secondary" onclick="closeConfirmModal()">Cancel</button>
                    <button class="btn btn-primary" id="confirmActionBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cropper Modal -->
    <div class="modal-overlay" id="cropperModal" style="z-index: 2000;">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2>Crop Image</h2>
                <button class="btn btn-secondary" onclick="closeCropperModal()" style="border:none; padding:4px;"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body" style="padding: 24px; text-align: center; flex-direction: column;">
                <div style="max-height: 400px; overflow: hidden; display: flex; justify-content: center; background: #333;">
                    <img id="cropperImage" src="" style="max-width: 100%; display: block;">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeCropperModal()">Cancel</button>
                <button class="btn btn-primary" onclick="applyCrop()">Crop & Save</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="js/supabase-data-service.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
