<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Menu QR - TAC</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        body {
            font-family: Georgia, serif !important;
            background-color: var(--color-surface-main);
            margin: 0;
            padding: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--color-text-primary);
            box-sizing: border-box;
        }
        .qr-card {
            background: #FFFFFF;
            border-radius: 192px;
            box-shadow: 0 96px 288px rgba(0,0,0,0.06);
            text-align: center;
            width: 2280px;
            max-width: none;
            overflow: hidden;
            position: relative;
        }
        .qr-banner {
            height: 840px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            width: 100%;
            position: relative;
        }
        .qr-banner::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 240px;
            background: linear-gradient(to top, rgba(0,0,0,0.1), transparent);
        }
        .qr-profile-pic {
            width: 528px;
            height: 528px;
            background: var(--color-surface-focus);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -264px auto 96px;
            box-shadow: 0 48px 144px rgba(0,0,0,0.08);
            color: var(--color-primary);
            position: relative;
            z-index: 2;
        }
        .qr-profile-pic i, .qr-profile-pic svg {
            width: 240px;
            height: 240px;
            stroke-width: 1.5px;
        }
        .qr-content {
            padding: 0 192px 240px;
        }
        .qr-cafe-name {
            font-size: 156px;
            font-weight: 800;
            color: var(--color-text-primary);
            margin: 0 0 36px 0;
            letter-spacing: 3px;
        }
        .qr-tagline {
            font-size: 84px;
            color: var(--color-icon-secondary);
            margin: 0 0 168px 0;
            font-style: italic;
        }
        .qr-divider {
            height: 6px;
            background: var(--color-border-standard);
            width: 240px;
            margin: 0 auto 168px;
            opacity: 0.4;
        }
        .qr-menu-title {
            font-size: 108px;
            font-weight: 800;
            color: var(--color-primary);
            text-transform: uppercase;
            letter-spacing: 24px;
            margin: 0 0 144px 0;
        }
        .qr-container {
            display: inline-block;
            background: #FFFFFF;
            padding: 120px;
            border-radius: 168px;
            border: 12px dashed #BBAFA3;
            margin-bottom: 168px;
            box-shadow: 0 48px 144px rgba(0,0,0,0.04);
            transition: transform 0.3s ease;
        }
        .qr-container:hover {
            transform: scale(1.02);
        }
        .qr-container img {
            display: block;
            width: 1200px;
            height: 1200px;
            object-fit: contain;
        }
        .qr-desc {
            font-size: 90px;
            line-height: 1.6;
            color: var(--color-text-primary);
            margin: 0;
        }
        .qr-desc strong {
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="qr-card">
        <div class="qr-banner"></div>
        <div class="qr-profile-pic">
            <i data-lucide="coffee"></i>
        </div>
        
        <div class="qr-content">
            <h1 class="qr-cafe-name">TAC - The Artists' Cafe</h1>
            <p class="qr-tagline">Serving happiness, one slice at a time.</p>
            
            <div class="qr-divider"></div>
            
            <h2 class="qr-menu-title">Digital Menu</h2>
            
            <div class="qr-container">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=https://tac-menu.pages.dev" alt="Menu QR Code">
            </div>
            
            <p class="qr-desc">Scan to explore our menu<br>and discover your <strong>favorites!</strong></p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
